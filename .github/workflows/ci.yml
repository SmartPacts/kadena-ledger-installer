name: CI

on:
  workflow_dispatch:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install test dependencies
        run: python -m pip install --quiet pytest
      - name: Byte-compile
        run: python -m py_compile kadena_ledger_install.py
      - name: Run tests
        run: python -m pytest tests/ -q

  verify-pins:
    name: Pinned release still matches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dry run against the published release
        # Fails loudly if the upstream release asset ever changes under a published tag.
        run: python kadena_ledger_install.py --dry-run

  shell:
    name: Shell wrappers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck bin/install-kadena-linux.sh "bin/Install Kadena on Ledger.command"
